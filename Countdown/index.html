<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="photo"></div>

<div class="wrapper">
    <h1>ДО НОВОГО РОКУ ЗАЛИШИЛОСЬ:</h1>

    <div class="items">
        <div class="item">
            <div class="card"><span id="days"></span></div>
            <p>Днів</p>
        </div>

        <div class="item">
            <div class="card"><span id="hours"></span></div>
            <p>Годин</p>
        </div>

        <div class="item">
            <div class="card"><span id="minutes"></span></div>
            <p>Хвилин</p>
        </div>

        <div class="item">
            <div class="card"><span id="seconds"></span></div>
            <p>Секунд</p>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
