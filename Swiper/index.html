<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"/>
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>


<!-- Swiper -->
<div class="swiper mySwiper">
  <div class="swiper-wrapper">
    <div class="swiper-slide"><img alt="" src="photo/1.jpg"></div>
    <div class="swiper-slide"><img alt="" src="photo/2.jpg"></div>
    <div class="swiper-slide"><img alt="" src="photo/3.webp"></div>
    <div class="swiper-slide"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/_5jPscpSD5s?autoplay=1&mute=1&loop=1&playlist=_5jPscpSD5s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <div class="swiper-slide"><img alt="" src="photo/4.jpg"></div>
    <div class="swiper-slide"><img alt="" src="photo/5.webp"></div>
    <div class="swiper-slide"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/DymJvK1Dj0s?autoplay=1&mute=1&loop=1&playlist=DymJvK1Dj0s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <div class="swiper-slide"><img alt="" src="photo/6.webp"></div>
    <div class="swiper-slide"><img alt="" src="photo/7.jpg"></div>
  </div>
  <div class="swiper-button-next"><img alt="" src="photo/arrow-right.png"></div>
  <div class="swiper-button-prev"><img alt="" src="photo/arrow-right.png"></div>
  <div class="swiper-pagination"></div>
</div>


<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
